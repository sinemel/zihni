services:
  postgres:
    image: postgres:16-alpine
    container_name: kognita-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kognita
      POSTGRES_PASSWORD: kognita_dev_password
      POSTGRES_DB: kognita
    ports:
      - "5432:5432"
    volumes:
      - kognita_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kognita"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  kognita_pgdata:
